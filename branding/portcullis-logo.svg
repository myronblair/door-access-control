<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Lato, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="55%" stop-color="#e0b23b"/>
      <stop offset="100%" stop-color="#b8841f"/>
    </linearGradient>
    <path id="topArc" d="M 66,206 A 136,136 0 0 1 334,206" fill="none"/>
    <path id="botArc" d="M 330,210 A 132,132 0 0 1 70,210" fill="none"/>
  </defs>

  <!-- seal rings -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#brass)" stroke-width="7"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#brass)" stroke-width="2" opacity=".7"/>

  <!-- wordmark around the seal -->
  <text fill="url(#brass)" font-size="40" font-weight="800" letter-spacing="7">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">PORTCULLIS</textPath>
  </text>
  <text fill="url(#brass)" font-size="19" font-weight="700" letter-spacing="8" opacity=".92">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">ACCESS CONTROL</textPath>
  </text>
  <!-- side separators -->
  <g fill="url(#brass)"><circle cx="40" cy="200" r="4"/><circle cx="360" cy="200" r="4"/></g>

  <!-- central shield crest (security, not a literal gate) -->
  <g>
    <path d="M200 96 L250 116 L250 190 Q250 236 200 262 Q150 236 150 190 L150 116 Z"
          fill="#161d27" stroke="url(#brass)" stroke-width="6"/>
    <!-- subtle lattice hint -->
    <g stroke="url(#brass)" stroke-width="3" opacity=".55" stroke-linecap="round">
      <line x1="178" y1="120" x2="178" y2="240"/>
      <line x1="222" y1="120" x2="222" y2="240"/>
      <line x1="158" y1="150" x2="242" y2="150"/>
    </g>
    <!-- keyhole -->
    <g fill="url(#brass)">
      <circle cx="200" cy="176" r="15"/>
      <path d="M192 186 L208 186 L213 224 L187 224 Z"/>
    </g>
  </g>
</svg>
